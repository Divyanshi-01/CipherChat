spring:
  application:
    name: cipherchat-frontend

  thymeleaf:
    cache: false
    mode: HTML
    enabled: true

server:
  port: ${PORT:8081}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.p2p.messaging: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
